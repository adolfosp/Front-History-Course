<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HistoryCourse</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    .boot-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #080808;
      color: #c7c7c7;
      font-family: Roboto, Arial, sans-serif;
    }
    .boot-splash__spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(251, 140, 0, 0.2);
      border-top-color: #fb8c00;
      animation: boot-splash-spin 0.8s linear infinite;
    }
    @keyframes boot-splash-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="mat-typography">
  <app-root>
    <div class="boot-splash" role="status">
      <span class="boot-splash__spinner" aria-hidden="true"></span>
      <span>Abrindo History Course...</span>
    </div>
  </app-root>
</body>
</html>
