<main>
  <div class="container">
    <div class="hero-actions">
      <button type="button" class="theme-toggle" (click)="toggleTheme()">
        {{ isDarkTheme ? 'Tema claro' : 'Tema escuro' }}
      </button>
    </div>
    <h1>📚 Histórico de Cursos</h1>
    <p>Acompanhe e gerencie o seu progresso acadêmico de forma simples e intuitiva.</p>

    <div class="image-box">
     <img src="https://cdn.asp.dev.br/imagens/logos/front-history-course.png" alt="Histórico de Cursos">
    </div>

    <div class="content">
      <router-outlet></router-outlet>
      <h3 id="version">v{{version}}</h3>
    </div>
  </div>
</main>
