<main class="app-shell">
  <header class="app-header">
    <canvas #heroCanvas class="hero-canvas" aria-hidden="true"></canvas>
    <div class="brand">
      <img src="front-history-course.svg" alt="History Course">
      <div>
        <h1>Historico de Cursos</h1>
        <p>Organize a fila, abra cursos baixados e acompanhe seu progresso.</p>
      </div>
    </div>

    <button type="button" class="theme-toggle" (click)="toggleTheme()">
      {{ isDarkTheme ? 'Tema claro' : 'Tema escuro' }}
    </button>
  </header>

  <section class="content">
    <router-outlet></router-outlet>
  </section>

  <span id="version">v{{version}}</span>
</main>
